name: Deploy Portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-portfolio
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Otherwise the default GITHUB_TOKEN is used for every github.com push,
          # and it cannot write to nicholas_portfolio.
          persist-credentials: false

      - name: Verify deploy token
        run: |
          if [ -z "${{ secrets.GH_PAGES_TOKEN }}" ]; then
            echo "::error::Missing GH_PAGES_TOKEN secret."
            echo "Go to fluid-portfolio → Settings → Secrets and variables → Actions"
            echo "Create secret GH_PAGES_TOKEN with a Personal Access Token (repo scope)."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to GitHub Pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npx gh-pages -d dist --repo "https://x-access-token:${GH_TOKEN}@github.com/Nichk2/nicholas_portfolio.git"
        env:
          GH_TOKEN: ${{ secrets.GH_PAGES_TOKEN }}
